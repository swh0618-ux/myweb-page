site_name: "KAZAN"
site_description: "AI 네이티브 개발자의 바이브코딩 랩 — 프로젝트, 기술 로그, 오픈소스 도구"
site_author: "Kazan"
site_url: "https://kazan.pe.kr/"
repo_url: "https://github.com/swh0618-ux/myweb-page"
repo_name: "swh0618-ux/myweb-page"

theme:
  name: material
  custom_dir: overrides
  language: ko
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Light mode"
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: "Dark mode"
  font:
    text: Pretendard Variable
    code: Fira Code
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: ko
  - blog:
      blog_dir: signal
      post_dir: posts
      post_url_format: "{date}/{slug}"
      pagination_per_page: 8
      authors: true
      authors_file: signal/.authors.yml

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - stylesheets/design.css
  - stylesheets/animations.css

extra_javascript:
  - javascripts/main.js

nav:
  - HOME: index.md
  - LAB:
      - "All Projects": lab/index.md
      - "Antigravity Plugins & MCP": lab/antigravity-plugins.md
      - "Python Vibe VPN": lab/python-vibe-vpn.md
      - "Kazan Agent Hub": lab/kazan-agent-hub.md
      - "Item Asset Forge": lab/item-asset-forge.md
  - SIGNAL:
      - signal/index.md
  - TOOLS: tools/index.md
  - ABOUT: about.md

extra:
  google_adsense_client: "ca-pub-4587488147003975"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/swh0618-ux
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.com
      name: Discord
    - icon: fontawesome/solid/envelope
      link: mailto:your-email@example.com
      name: Email
