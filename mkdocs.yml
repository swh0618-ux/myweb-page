site_name: "Kazan | Vibe Coding Lab"
site_description: "AI 에이전트와 함께 빌드하는 바이브코딩 포트폴리오 & 테크 블로그"
site_author: "Kazan"
site_url: "https://swh0618-ux.github.io/myweb-page/"
repo_url: "https://github.com/swh0618-ux/myweb-page"
repo_name: "swh0618-ux/myweb-page"

theme:
  name: material
  custom_dir: overrides
  language: ko
  palette:
    # 🌙 Vibe Coding Dark Mode (Default)
    - scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: "라이트 모드로 전환"
    # ☀️ Clean Light Mode
    - scheme: default
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: "다크 모드로 전환"
  font:
    text: Pretendard, -apple-system, BlinkMacSystemFont, Roboto, sans-serif
    code: Fira Code, JetBrains Mono, monospace
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: posts
      post_url_format: "{date}/{slug}"
      pagination_per_page: 5
      authors: true
      authors_file: blog/.authors.yml

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

nav:
  - "Home": index.md
  - "Projects": 
      - "Overview": projects/index.md
      - "Python Vibe VPN": projects/python-vibe-vpn.md
      - "Kazan Agent Hub": projects/kazan-agent-hub.md
      - "Item Asset Forge": projects/item-asset-forge.md
  - "Vibe Logs": 
      - blog/index.md
  - "About": about.md
  - "Privacy": privacy.md

extra:
  # 구글 애드센스 퍼블리셔 ID (예: "ca-pub-1234567890123456")
  google_adsense_client: "ca-pub-XXXXXXXXXXXXXXXX"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/swh0618-ux
    - icon: fontawesome/brands/discord
      link: https://discord.com
    - icon: fontawesome/solid/envelope
      link: mailto:your-email@example.com
